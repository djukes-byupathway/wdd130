<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - WWR, Inc.</title>
    <meta name="description"
      content="White Water Rafting, Inc. - Information On How To Contact Us Page">
    <meta name="author" content="David Arthur Jukes">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="White Water Rafting logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html"> Home </a></li>
                <li><a href="about.html"> About Us </a></li>
                <li><a href="trips.html"> Trips </a></li>
                <li><a href="contact.html"> Contact Us </a></li>
            </ul>
        </nav>
    </header>
    <main>
        
        <section class="gen-info">
            <h2>White Water Rafting, Inc</h2>
            <div class="left-col row-2">
                <p>123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@wwr.com</p>
            </div>
            <div class="left-col row-3">
                <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6188.935644165995!2d-97.8927644155058!3d30.337937234897403!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1770757453683!5m2!1sen!2sus"
                width="600" height="375" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <div class="right-col dbl-row">
                
                <form action="#">
                    <fieldset>
                        <legend>Contact Us</legend>

                        <div class="form-item column2">
                            <label for="contact">Name</label>
                            <input type="text" name="contact" id="contact">
                        </div>

                        <div class="form-item column2">
                        <label for="user-email">Email</label>
                        <input type="email" name="user-email" id="user-email">
                        </div>

                        <div class="form-item column2">
                            <div>
                                <p>Message Purpose</p>
                            </div>
                            <div class="form-item column3">
                                <input type="radio" id="gen" name="purpose" value="gen">
                                <label class="radio-label" for="gen">General Inquiry</label>

                                <input type="radio" id="resv" name="purpose" value="resv">
                                <label class="radio-label" for="resv">Reservation Question</label>

                                <input type="radio" id="sugg" name="purpose" value="sugg">
                                <label class="radio-label" for="sugg">Website Suggestion</label>
                            </div>
                        </div>

                        <label class="radio-label" for="msg">Message</label>
                        <textarea name="msg" id="msg" rows="5" required></textarea>
                        <div class="column2">
                            <input type="checkbox" name="subscribe" id="subscribe">
                            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        </div>
                    </fieldset>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>
        <section class="fig emp">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/beard.jpg" alt="Bob the Beard">
                <figcaption>Bob "The Beard" Smith</figcaption>
            </figure>
            <figure>
                <img src="images/old_man.jpg" alt="Old Man Omar">
                <figcaption>"Old Man" Omar Reed</figcaption>
            </figure>
            <figure>
                <img src="images/young_gun.jpg" alt="Young Gun Greta">
                <figcaption>Greta "Young Gun" Young</figcaption>
            </figure>
            
        </section>

    </main>
    <footer>
        <p>© 2026 🇺🇸 White Water Rafting, Inc. 🇺🇸 David Jukes</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram">
            </a>
            <a href="https://x.com">
                <img src="images/268058_x-logo-icon.png" alt="X.com fka Twitter">
            </a>
        </nav>
    </footer>
</body>

</html>
